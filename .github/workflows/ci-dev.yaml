name: CI - Dev to Test (Remote Trigger)

# Trigger: Only on Pull Requests targeting the 'test' branch (Dev -> Test merge)
on:
  pull_request:
    branches:
      - test

jobs:
  deploy-and-test:
    name: Deploy, Retrain, and Evaluate
    runs-on: ubuntu-latest
    permissions:
      contents: write      # To write comments
      pull-requests: write # To post CML reports
      issues: write
      statuses: write
    
    steps:
      # 1. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Install Astro CLI (Required for manual wake/sleep commands)
      - name: Install Astro CLI
        run: |
          curl -sSL install.astronomer.io | sudo bash -s

      # 3. WAKE UP & WAIT FOR HEALTH
      - name: Wake Up Astro Deployment
        env:
          ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}
          DEPLOYMENT_ID: ${{ secrets.ASTRO_DEPLOYMENT_ID }}
        run: |
          echo "🚀 Waking up deployment..."
          astro deployment wake-up $DEPLOYMENT_ID --force

          echo "⏳ Waiting for deployment to become HEALTHY..."
          MAX_RETRIES=60
          COUNT=0
          
          while [ $COUNT -lt $MAX_RETRIES ]; do
            # Fetch full JSON and use jq to find the status field safely
            # We try multiple common paths: .status, .metadata.status, .healthStatus
            JSON_OUTPUT=$(astro deployment inspect $DEPLOYMENT_ID --output json)
            STATUS=$(echo $JSON_OUTPUT | jq -r '.status // .metadata.status // .healthStatus // "UNKNOWN"')
            
            echo "   Current Status: $STATUS"
            
            if [ "$STATUS" == "HEALTHY" ]; then
              echo "✅ Deployment is ready!"
              exit 0
            fi
            
            sleep 10
            COUNT=$((COUNT+1))
          done
          
          echo "❌ Timeout waiting for deployment to wake up."
          exit 1

      # 4. Deploy Code to Astronomer Cloud
      # We disable wake-on-deploy so this action doesn't try to "cleanup" (hibernate) afterwards
      - name: Deploy to Astro
        uses: astronomer/deploy-action@v0.11.0
        with:
          deployment-id: ${{ secrets.ASTRO_DEPLOYMENT_ID }}
          parse: false   # Keep false if you have library import issues during parse
          wake-on-deploy: false
        env:
          ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}

      # 5. Setup Python for Scripts
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 6. Setup CML (Continuous Machine Learning)
      - name: Setup CML
        uses: iterative/setup-cml@v1

      # 7. Install Dependencies for Scripts
      - name: Install Dependencies
        run: pip install requests mlflow pandas

      # 8. Trigger Remote DAG & Wait for Completion
      # Now the deployment is definitely awake, so this script won't hit a 503 error
      - name: Trigger & Monitor DAG
        env:
          ASTRO_AIRFLOW_URL: ${{ secrets.ASTRO_AIRFLOW_URL }}
          ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}
          GIT_BRANCH: "dev"
        run: python scripts/trigger_and_monitor.py

      # 9. Compare Metrics & Post Report (The Gatekeeper)
      # Only runs if Step 8 (DAG) succeeded.
      - name: Compare Metrics & Report
        env:
          DAGSHUB_USERNAME: "Noor-Ul-Baseer"
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          REPO_NAME: "Real-Time-Predictive-System"
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/compare_metrics.py
          cml comment create report.md

      # 10. HIBERNATE DEPLOYMENT (Cleanup)
      # This runs 'always()', even if the tests fail, so you don't waste money.
      - name: Hibernate Astro Deployment
        if: always()
        env:
          ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}
        run: |
          # Remove the override we created in Step 3, allowing the schedule to resume (or sleep)
          astro deployment hibernate ${{ secrets.ASTRO_DEPLOYMENT_ID }} --remove-override --force
          echo "Deployment hibernation schedule resumed."