name: CI - Dev to Test (Remote Trigger)

# Trigger: Only on Pull Requests targeting the 'test' branch (Dev -> Test merge)
on:
  pull_request:
    branches:
      - test

  schedule:
    - cron: '0 0 * * *'  # Daily at 12:00 AM UTC
  workflow_dispatch:  # Manual trigger option

jobs:
  deploy-and-test:
    name: Deploy, Retrain, and Evaluate
    runs-on: ubuntu-latest
    permissions:
      contents: write  # To write comments
      pull-requests: write  # To post CML reports
      issues: write
      statuses: write
      actions: read  # To check status of previous workflow runs (Bot Path)

    steps:
      # 1. Checkout Code with full history for commit message check
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2. CI Logic: Determine if commit is from bot or human
      - name: Check Commit Message
        id: check_commit
        run: |
          # Get the SHA of the actual commit on the branch
          # If triggered by PR, use head.sha. If schedule/dispatch, use GITHUB_SHA.
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          if [[ -z "$HEAD_SHA" ]]; then HEAD_SHA=$GITHUB_SHA; fi
          
          # Read the message of THAT specific commit
          msg=$(git log -1 --pretty=%B $HEAD_SHA)
          echo "Real Commit message: $msg"
          
          if [[ "$msg" == *"ETL Update"* ]]; then
            echo "🤖 Bot commit detected. Skipping heavy tests."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "👤 Human commit detected. Running tests."
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      # HUMAN PATH START

      # 3. Install Astro CLI
      - name: Install Astro CLI
        if: steps.check_commit.outputs.should_run == 'true'
        run: |
          curl -sSL install.astronomer.io | sudo bash -s

      # 4. WAKE UP Astro Deployment
      - name: Wake Up Astro Deployment
        if: steps.check_commit.outputs.should_run == 'true'
        env:
          ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}
          DEPLOYMENT_ID: ${{ secrets.ASTRO_DEPLOYMENT_ID }}
        run: |
          echo "🚀 Sending Wake Up Command..."
          # Send wake-up command (continue if already awake)
          astro deployment wake-up $DEPLOYMENT_ID --force || true

          echo "⏳ Polling for HEALTHY status (Max 10 mins)..."
          MAX_RETRIES=60
          COUNT=0
          
          while [ $COUNT -lt $MAX_RETRIES ]; do
            # Fetch the list of deployments (Returns a text table)
            OUTPUT=$(astro deployment list)
            
            # 1. Filter for the row containing our Deployment ID
            # 2. Check if that row contains the word "HEALTHY"
            if echo "$OUTPUT" | grep "$DEPLOYMENT_ID" | grep -q "HEALTHY"; then
              echo "✅ Deployment is HEALTHY and Ready!"
              exit 0
            fi
            
            echo "   Attempt $((COUNT+1))/60: Still waking up..."
            sleep 10
            COUNT=$((COUNT+1))
          done
          
          echo "❌ Timeout: Deployment did not become HEALTHY in time."
          exit 1

      # 5. Deploy Code to Astronomer Cloud
      - name: Deploy to Astro
        if: steps.check_commit.outputs.should_run == 'true'
        uses: astronomer/deploy-action@v0.11.0
        with:
          deployment-id: ${{ secrets.ASTRO_DEPLOYMENT_ID }}
          parse: false   # Skipped to avoid import errors
          wake-on-deploy: false # Manual wake-up handles this
        env:
          ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}

      # 6. Setup Python
      - name: Setup Python
        if: steps.check_commit.outputs.should_run == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 7. Setup CML 
      - name: Setup CML
        if: steps.check_commit.outputs.should_run == 'true'
        uses: iterative/setup-cml@v1

      # 8. Install Dependencies
      - name: Install Dependencies
        if: steps.check_commit.outputs.should_run == 'true'
        run: pip install requests mlflow pandas

      # 9. Trigger Remote DAG & Wait
      - name: Trigger & Monitor DAG
        if: steps.check_commit.outputs.should_run == 'true'
        env:
          ASTRO_AIRFLOW_URL: ${{ secrets.ASTRO_AIRFLOW_URL }}
          ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}
          GIT_BRANCH: "dev"
        run: python scripts/trigger_and_monitor.py

      # 10. Compare Metrics & Post Report
      - name: Compare Metrics & Report
        if: steps.check_commit.outputs.should_run == 'true'
        env:
          DAGSHUB_USERNAME: "Noor-Ul-Baseer"
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          REPO_NAME: "Real-Time-Predictive-System"
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/compare_metrics.py

      # 11. HIBERNATE DEPLOYMENT (Cleanup)
      # Runs ONLY if Human path ran, and ALWAYS runs even if tests failed
      - name: Hibernate Astro Deployment
        if: always() && steps.check_commit.outputs.should_run == 'true'
        env:
          ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}
          DEPLOYMENT_ID: ${{ secrets.ASTRO_DEPLOYMENT_ID }}
        run: |
          echo "😴 Putting deployment back to sleep..."
          astro deployment hibernate $DEPLOYMENT_ID --remove-override --force
          echo "Deployment hibernation schedule resumed."

      # BOT PATH START

      # 12. Verify Parent Commit Status
      # If this is a bot commit, ensure the previous human commit actually PASSED
      - name: Verify Parent Commit Status
        if: steps.check_commit.outputs.should_run == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Get Parent Commit SHA
          PARENT_SHA=$(git rev-parse HEAD^1)
          echo "🔍 Checking status of Parent Commit: $PARENT_SHA"
          
          # 2. Fetch status of the latest run for that commit
          STATUS=$(gh run list --commit $PARENT_SHA --workflow "CI - Dev to Test (Remote Trigger)" --json conclusion --jq '.[0].conclusion')
          
          echo "Parent Commit Status: $STATUS"
          
          # 3. Decide
          if [[ "$STATUS" == "success" ]]; then
            echo "✅ Parent commit passed tests. This data update is valid."
            exit 0
          elif [[ "$STATUS" == "skipped" || "$STATUS" == "" ]]; then
             echo "⚠️ Parent status unclear ($STATUS). Proceeding with caution."
             exit 0
          else
            echo "❌ Parent commit FAILED or Cancelled. Blocking this merge."
            exit 1
          fi