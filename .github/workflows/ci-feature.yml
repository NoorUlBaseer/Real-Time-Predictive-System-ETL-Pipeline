name: CI - Feature to Dev

# Trigger: Only on Pull Requests targeting the 'dev' branch
on:
  pull_request:
    branches:
      - dev

jobs:
  quality-gate:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Set up Python environment (using 3.9 as it's stable for Airflow)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip' # Caches dependencies to speed up future runs

      # 3. Install Dependencies
      # We need Airflow installed so the 'import airflow' statements in tests don't fail
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Linting (Static Code Analysis)
      # Stops the build if there are syntax errors or undefined names
      - name: Run Flake8 (Syntax Errors)
        run: |
          # E9,F63,F7,F82 denotes syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # 5. Linting (Style Warnings - Optional)
      # This checks for style issues but won't fail the build (exit-zero)
      - name: Run Flake8 (Style Warnings)
        run: |
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

        # 6. Initialize Airflow DB for Unit Tests
        # Airflow needs a database initialized to run certain tests
      - name: Initialize Airflow DB
        env:
          AIRFLOW_HOME: ${{ github.workspace }}/airflow
        run: |
          mkdir -p $AIRFLOW_HOME
          airflow db init

      # 7. Run Unit Tests
      # Run the tests we created in tests/test_dag_extended.py
      - name: Run Unit Tests
        env:
          AIRFLOW_HOME: ${{ github.workspace }}/airflow
          # Note the Double Underscores ()
          AIRFLOW_CORE_LOAD_EXAMPLES: 'False'
          AIRFLOW_CORE_UNIT_TEST_MODE: 'True'
          # Explicitly point to the DB file we just created
          AIRFLOW_DATABASE_SQL_ALCHEMY_CONN: sqlite:///${{ github.workspace }}/airflow/airflow.db
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest tests/