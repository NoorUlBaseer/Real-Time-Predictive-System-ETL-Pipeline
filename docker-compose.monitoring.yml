version: '3.8'

services:
  # 1. Your Prediction API
  stock-api:
    build: 
      context: .
      dockerfile: inference/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./inference/model_dir:/app/model_dir  # Mount local model for testing
    networks:
      - monitoring-net

  # 2. Prometheus (The Collector)
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring-net

  # 3. Grafana (The Dashboard)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - monitoring-net

networks:
  monitoring-net: